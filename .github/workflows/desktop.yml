# Compila l'app desktop Windows (GynoSystem.exe, installer NSIS) dalla versione
# web attuale. Parte solo:
#  - con un tag "desktop-vX.Y.Z" (crea una release in BOZZA con l'installer,
#    visibile solo al proprietario finché non la si pubblica)
#  - a mano dal tab Actions → "App desktop" → Run workflow (solo l'installer
#    come artefatto scaricabile)
name: App desktop (Windows)

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Dipendenze
        run: npm ci

      - name: Prepara l'app (index.html + librerie locali + bridge database)
        run: node scripts/prepara-app.mjs

      - name: Compila
        run: npx tauri build

      - name: Installer come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: GynoSystem-installer-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release in bozza (solo per i tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: GynoSystem Desktop ${{ github.ref_name }}
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
